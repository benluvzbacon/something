name: Build & Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke:all
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: terrasim-dist
          path: dist
